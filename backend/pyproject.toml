[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lizibei-backend"
version = "0.1.0"
description = "栗子杯 V1 FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "bleach>=6.2,<7",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "networkx>=3.5,<4",
  "pillow>=11.3,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
