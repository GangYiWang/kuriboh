services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lizibei}
      POSTGRES_USER: ${POSTGRES_USER:-lizibei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lizibei}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lizibei-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lizibei} -d ${POSTGRES_DB:-lizibei}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lizibei-postgres-data:

